services:
  app:
    build: .
    restart: always
    ports:
      - "8000:80"
    environment:
      POSTGRES_URL: postgres://postgres:postgres@db:5432/postgres
      MAINTENANCE: "false"
    depends_on:
      - db
    volumes:
      - ./data:/var/www/data

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
