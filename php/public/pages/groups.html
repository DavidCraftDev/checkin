<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruppen - CheckIN</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="dashboard.html" class="logo">CheckIN</a>
                <nav class="nav">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="user-overview.html">Meine Übersicht</a>
                    <a href="events.html">Veranstaltungen</a>
                    <a href="groups.html" class="active">Gruppen</a>
                    <span id="username"></span>
                    <a href="#" id="logoutBtn" class="btn btn-secondary">Abmelden</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mt-4">
        <h1>Gruppenübersicht</h1>

        <div id="alert-container"></div>

        <div class="card mt-3">
            <h2 class="card-title">Gruppe auswählen</h2>
            <div class="grid grid-cols-3">
                <div class="form-group">
                    <label class="form-label">Gruppenname</label>
                    <input type="text" id="groupName" class="form-input" placeholder="z.B. Klasse 12a">
                </div>
                <div class="form-group">
                    <label class="form-label">Kalenderwoche</label>
                    <input type="number" id="groupCW" class="form-input" min="1" max="53">
                </div>
                <div class="form-group">
                    <label class="form-label">&nbsp;</label>
                    <button id="loadGroupBtn" class="btn btn-primary" style="width: 100%;">Laden</button>
                </div>
            </div>
        </div>

        <div class="card mt-3">
            <h2 class="card-title">Gruppenmitglieder</h2>
            <div id="groupContent">
                <p class="text-center text-secondary">Wählen Sie eine Gruppe aus</p>
            </div>
        </div>

        <div class="text-center mt-3">
            <button id="exportBtn" class="btn btn-secondary hidden">Als Excel exportieren</button>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script>
        if (!utils.requireAuth()) {
            // Will redirect
        }

        const user = utils.getCurrentUser();
        document.getElementById('username').textContent = user.username;

        // Check permission
        if (user.permission < 1) {
            window.location.href = 'dashboard.html';
        }

        // Set default values
        document.getElementById('groupCW').value = utils.getCurrentWeek();

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await api.logout();
                utils.clearUser();
                window.location.href = 'login.html';
            } catch (error) {
                utils.clearUser();
                window.location.href = 'login.html';
            }
        });

        // Load group
        document.getElementById('loadGroupBtn').addEventListener('click', loadGroup);

        async function loadGroup() {
            const groupName = document.getElementById('groupName').value.trim();
            const cw = parseInt(document.getElementById('groupCW').value);

            if (!groupName) {
                utils.showAlert('Bitte geben Sie einen Gruppennamen ein', 'error');
                return;
            }

            const contentDiv = document.getElementById('groupContent');
            utils.showLoading(contentDiv);

            try {
                const data = await api.getGroupOverview(groupName, cw, new Date().getFullYear());

                if (data.users && data.users.length > 0) {
                    contentDiv.innerHTML = `
                        <p class="mb-3"><strong>Gruppe:</strong> ${data.group} | <strong>KW:</strong> ${data.cw}</p>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Benutzername</th>
                                    <th>Berechtigung</th>
                                    <th>Teilnahmen (KW ${data.cw})</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.users.map(u => {
                                    const attendanceCount = data.attendances?.filter(a => a.userID === u.id).length || 0;
                                    return `
                                        <tr>
                                            <td>${u.displayname}</td>
                                            <td>${u.username}</td>
                                            <td><span class="badge badge-${u.permission >= 2 ? 'danger' : u.permission >= 1 ? 'warning' : 'success'}">${u.permission >= 2 ? 'Admin' : u.permission >= 1 ? 'Lehrer' : 'Schüler'}</span></td>
                                            <td>${attendanceCount}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                        <p class="text-secondary mt-3">Gesamt: ${data.users.length} Mitglieder</p>
                    `;

                    document.getElementById('exportBtn').classList.remove('hidden');
                } else {
                    contentDiv.innerHTML = '<p class="text-center text-secondary">Keine Mitglieder in dieser Gruppe gefunden</p>';
                    document.getElementById('exportBtn').classList.add('hidden');
                }
            } catch (error) {
                console.error('Failed to load group:', error);
                contentDiv.innerHTML = `<p class="text-center alert-error">Fehler beim Laden: ${error.message}</p>`;
            }
        }

        // Export functionality (placeholder)
        document.getElementById('exportBtn').addEventListener('click', () => {
            const groupName = document.getElementById('groupName').value;
            const cw = document.getElementById('groupCW').value;
            utils.showAlert(`Export-Funktion für Gruppe "${groupName}" (KW ${cw}) wird implementiert`, 'warning');
        });
    </script>
</body>
</html>
