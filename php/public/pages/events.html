<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veranstaltungen - CheckIN</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="dashboard.html" class="logo">CheckIN</a>
                <nav class="nav">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="user-overview.html">Meine Übersicht</a>
                    <a href="events.html" class="active">Veranstaltungen</a>
                    <span id="username"></span>
                    <a href="#" id="logoutBtn" class="btn btn-secondary">Abmelden</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mt-4">
        <div class="header-content mb-3">
            <h1>Veranstaltungen</h1>
            <button id="createEventBtn" class="btn btn-primary">Neue Veranstaltung</button>
        </div>

        <div id="alert-container"></div>

        <!-- Create Event Modal -->
        <div id="createModal" class="hidden">
            <div class="card">
                <h2 class="card-title">Neue Veranstaltung erstellen</h2>
                <form id="createEventForm">
                    <div class="form-group">
                        <label class="form-label">Typ</label>
                        <input type="text" id="eventType" class="form-input" required placeholder="z.B. Studienzeit, Workshop">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Kalenderwoche</label>
                        <input type="number" id="eventCW" class="form-input" min="1" max="53" required>
                    </div>
                    <div class="grid grid-cols-2">
                        <button type="button" id="cancelCreate" class="btn btn-secondary">Abbrechen</button>
                        <button type="submit" class="btn btn-primary">Erstellen</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Filter</h2>
            <div class="grid grid-cols-3">
                <div class="form-group">
                    <label class="form-label">Kalenderwoche</label>
                    <input type="number" id="filterCW" class="form-input" min="1" max="53">
                </div>
                <div class="form-group">
                    <label class="form-label">Jahr</label>
                    <input type="number" id="filterYear" class="form-input" min="2020" max="2030">
                </div>
                <div class="form-group">
                    <label class="form-label">&nbsp;</label>
                    <button id="filterBtn" class="btn btn-primary" style="width: 100%;">Filtern</button>
                </div>
            </div>
        </div>

        <div class="card mt-3">
            <h2 class="card-title">Meine Veranstaltungen</h2>
            <div id="eventsList">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script>
        if (!utils.requireAuth()) {
            // Will redirect
        }

        const user = utils.getCurrentUser();
        document.getElementById('username').textContent = user.username;

        // Check permission
        if (user.permission < 1) {
            window.location.href = 'dashboard.html';
        }

        // Set default filter values
        const currentWeek = utils.getCurrentWeek();
        const currentYear = new Date().getFullYear();
        document.getElementById('filterCW').value = currentWeek;
        document.getElementById('filterYear').value = currentYear;
        document.getElementById('eventCW').value = currentWeek;

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await api.logout();
                utils.clearUser();
                window.location.href = 'login.html';
            } catch (error) {
                utils.clearUser();
                window.location.href = 'login.html';
            }
        });

        // Create event modal
        const createModal = document.getElementById('createModal');
        const createEventBtn = document.getElementById('createEventBtn');
        const cancelCreate = document.getElementById('cancelCreate');
        const createEventForm = document.getElementById('createEventForm');

        createEventBtn.addEventListener('click', () => {
            createModal.classList.remove('hidden');
        });

        cancelCreate.addEventListener('click', () => {
            createModal.classList.add('hidden');
            createEventForm.reset();
        });

        createEventForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const type = document.getElementById('eventType').value;
            const cw = parseInt(document.getElementById('eventCW').value);

            try {
                await api.createEvent({ type, cw });
                utils.showAlert('Veranstaltung erfolgreich erstellt', 'success');
                createModal.classList.add('hidden');
                createEventForm.reset();
                loadEvents();
            } catch (error) {
                utils.showAlert('Fehler beim Erstellen: ' + error.message, 'error');
            }
        });

        // Load events
        async function loadEvents() {
            const cw = parseInt(document.getElementById('filterCW').value);
            const year = parseInt(document.getElementById('filterYear').value);

            const listDiv = document.getElementById('eventsList');
            utils.showLoading(listDiv);

            try {
                const data = await api.getEvents({ cw, year, user: user.id });

                if (data.events && data.events.length > 0) {
                    listDiv.innerHTML = `
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Typ</th>
                                    <th>KW</th>
                                    <th>Erstellt am</th>
                                    <th>Aktionen</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.events.map(event => `
                                    <tr>
                                        <td>${event.type}</td>
                                        <td>${event.cw}</td>
                                        <td>${utils.formatDate(event.created_at)}</td>
                                        <td>
                                            <a href="qr-generator.html?eventId=${event.id}" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">QR Code</a>
                                            <button class="btn btn-danger delete-btn" data-id="${event.id}" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Löschen</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;

                    // Add delete handlers
                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const eventId = e.target.dataset.id;
                            if (confirm('Möchten Sie diese Veranstaltung wirklich löschen?')) {
                                try {
                                    await api.deleteEvent(eventId);
                                    utils.showAlert('Veranstaltung gelöscht', 'success');
                                    loadEvents();
                                } catch (error) {
                                    utils.showAlert('Fehler beim Löschen: ' + error.message, 'error');
                                }
                            }
                        });
                    });
                } else {
                    listDiv.innerHTML = '<p class="text-center text-secondary">Keine Veranstaltungen für diesen Zeitraum gefunden</p>';
                }
            } catch (error) {
                console.error('Failed to load events:', error);
                listDiv.innerHTML = `<p class="text-center alert-error">Fehler beim Laden: ${error.message}</p>`;
            }
        }

        // Filter button
        document.getElementById('filterBtn').addEventListener('click', loadEvents);

        // Load initial data
        loadEvents();
    </script>
</body>
</html>
