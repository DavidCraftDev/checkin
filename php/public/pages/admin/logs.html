<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs - CheckIN Admin</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="../dashboard.html" class="logo">CheckIN</a>
                <nav class="nav">
                    <a href="../dashboard.html">Dashboard</a>
                    <a href="../admin.html">Admin</a>
                    <a href="users.html">Benutzer</a>
                    <a href="logs.html" class="active">Logs</a>
                    <a href="settings.html">Einstellungen</a>
                    <span id="username"></span>
                    <a href="#" id="logoutBtn" class="btn btn-secondary">Abmelden</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mt-4">
        <div class="header-content mb-3">
            <h1>System Logs</h1>
            <div>
                <button id="refreshLogsBtn" class="btn btn-secondary">↻ Aktualisieren</button>
                <button id="exportLogsBtn" class="btn btn-secondary">Export</button>
                <button id="clearLogsBtn" class="btn btn-danger">Logs löschen</button>
            </div>
        </div>
        
        <div id="alert-container"></div>

        <div class="grid grid-cols-4">
            <div class="stat-card">
                <div class="stat-label">Einträge gesamt</div>
                <div class="stat-value" id="totalLogs">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Fehler</div>
                <div class="stat-value" id="errorLogs" style="color: #dc3545;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Warnungen</div>
                <div class="stat-value" id="warningLogs" style="color: #ffc107;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Info</div>
                <div class="stat-value" id="infoLogs" style="color: #007bff;">0</div>
            </div>
        </div>

        <div class="card mt-3">
            <h2 class="card-title">Filter & Suche</h2>
            <div class="grid grid-cols-4">
                <div class="form-group">
                    <label class="form-label">Log-Typ</label>
                    <select id="logTypeFilter" class="form-input">
                        <option value="">Alle</option>
                        <option value="application">Application</option>
                        <option value="security">Security</option>
                        <option value="database">Database</option>
                        <option value="api">API</option>
                        <option value="ldap">LDAP</option>
                        <option value="system">System</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Schweregrad</label>
                    <select id="severityFilter" class="form-input">
                        <option value="">Alle</option>
                        <option value="error">Error</option>
                        <option value="warning">Warning</option>
                        <option value="info">Info</option>
                        <option value="debug">Debug</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Zeitraum</label>
                    <select id="timeRangeFilter" class="form-input">
                        <option value="1h">Letzte Stunde</option>
                        <option value="24h" selected>Letzte 24 Stunden</option>
                        <option value="7d">Letzte 7 Tage</option>
                        <option value="30d">Letzte 30 Tage</option>
                        <option value="all">Alle</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Suche</label>
                    <input type="text" id="searchFilter" class="form-input" placeholder="Suche in Logs...">
                </div>
            </div>
            <div class="grid grid-cols-2">
                <div class="form-group">
                    <label class="form-label">Von Datum</label>
                    <input type="datetime-local" id="dateFromFilter" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Bis Datum</label>
                    <input type="datetime-local" id="dateToFilter" class="form-input">
                </div>
            </div>
            <button id="applyFilterBtn" class="btn btn-primary">Filter anwenden</button>
            <button id="resetFilterBtn" class="btn btn-secondary">Zurücksetzen</button>
        </div>

        <div class="card mt-3">
            <div class="header-content mb-2">
                <h2 class="card-title">Log-Einträge</h2>
                <div>
                    <label class="form-label" style="display: inline; margin-right: 1rem;">
                        <input type="checkbox" id="autoRefresh"> Auto-Refresh (5s)
                    </label>
                    <select id="logsPerPage" class="form-input" style="display: inline; width: auto;">
                        <option value="25">25 pro Seite</option>
                        <option value="50" selected>50 pro Seite</option>
                        <option value="100">100 pro Seite</option>
                        <option value="500">500 pro Seite</option>
                    </select>
                </div>
            </div>
            <div id="logsTable">
                <div class="spinner"></div>
            </div>
            <div id="pagination" class="mt-2" style="text-align: center;"></div>
        </div>

        <!-- Log Detail Modal -->
        <div id="logDetailModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;">
            <div class="card" style="max-width: 800px; width: 90%; margin: 20px; max-height: 80vh; overflow-y: auto;">
                <h2 class="card-title">Log-Details</h2>
                <div id="logDetailContent">
                    <div class="spinner"></div>
                </div>
                <button id="closeLogDetail" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;">Schließen</button>
            </div>
        </div>
    </main>

    <script src="../../assets/js/api.js"></script>
    <script>
        if (!utils.requireAuth()) {
            // Will redirect
        }

        const user = utils.getCurrentUser();
        document.getElementById('username').textContent = user.username;

        // Check permission - admin only
        if (user.permission < 2) {
            window.location.href = '../dashboard.html';
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await api.logout();
                utils.clearUser();
                window.location.href = '../login.html';
            } catch (error) {
                utils.clearUser();
                window.location.href = '../login.html';
            }
        });

        // Modal handlers
        const logDetailModal = document.getElementById('logDetailModal');
        document.getElementById('closeLogDetail').addEventListener('click', () => {
            logDetailModal.classList.add('hidden');
        });

        // Auto-refresh
        let autoRefreshInterval;
        document.getElementById('autoRefresh').addEventListener('change', (e) => {
            if (e.target.checked) {
                autoRefreshInterval = setInterval(loadLogs, 5000);
                utils.showAlert('Auto-Refresh aktiviert', 'success');
            } else {
                clearInterval(autoRefreshInterval);
                utils.showAlert('Auto-Refresh deaktiviert', 'warning');
            }
        });

        // Load logs
        let currentPage = 1;
        async function loadLogs() {
            const tableDiv = document.getElementById('logsTable');
            utils.showLoading(tableDiv);

            try {
                // Mock log data
                const mockLogs = [
                    { id: 1, timestamp: new Date().toISOString(), type: 'security', severity: 'info', user: 'admin', message: 'Benutzer angemeldet', ip: '192.168.1.100' },
                    { id: 2, timestamp: new Date(Date.now() - 3600000).toISOString(), type: 'api', severity: 'info', user: 'teacher1', message: 'API-Anfrage: GET /api/v1/events', ip: '192.168.1.101' },
                    { id: 3, timestamp: new Date(Date.now() - 7200000).toISOString(), type: 'database', severity: 'warning', user: 'system', message: 'Langsame Abfrage erkannt: 2.3s', ip: 'localhost' },
                    { id: 4, timestamp: new Date(Date.now() - 10800000).toISOString(), type: 'security', severity: 'error', user: 'unknown', message: 'Fehlgeschlagener Login-Versuch', ip: '203.0.113.42' },
                    { id: 5, timestamp: new Date(Date.now() - 14400000).toISOString(), type: 'ldap', severity: 'info', user: 'system', message: 'LDAP-Synchronisierung abgeschlossen', ip: 'localhost' },
                    { id: 6, timestamp: new Date(Date.now() - 18000000).toISOString(), type: 'application', severity: 'info', user: 'student1', message: 'Veranstaltung erstellt: Studienzeit', ip: '192.168.1.102' },
                    { id: 7, timestamp: new Date(Date.now() - 21600000).toISOString(), type: 'system', severity: 'warning', user: 'system', message: 'Hohe CPU-Auslastung: 85%', ip: 'localhost' },
                    { id: 8, timestamp: new Date(Date.now() - 25200000).toISOString(), type: 'security', severity: 'info', user: 'teacher2', message: 'Passwort geändert', ip: '192.168.1.103' }
                ];

                const logs = mockLogs;

                if (logs.length > 0) {
                    tableDiv.innerHTML = `
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Zeit</th>
                                    <th>Typ</th>
                                    <th>Schweregrad</th>
                                    <th>Benutzer</th>
                                    <th>Nachricht</th>
                                    <th>IP</th>
                                    <th>Aktion</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${logs.map(log => `
                                    <tr>
                                        <td style="font-size: 0.85rem;">${utils.formatDate(log.timestamp)} ${utils.formatTime(log.timestamp)}</td>
                                        <td><span class="badge badge-secondary">${log.type}</span></td>
                                        <td><span class="badge badge-${log.severity === 'error' ? 'danger' : log.severity === 'warning' ? 'warning' : 'success'}">${log.severity}</span></td>
                                        <td>${log.user}</td>
                                        <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${log.message}</td>
                                        <td style="font-size: 0.85rem;">${log.ip}</td>
                                        <td>
                                            <button class="btn btn-primary view-log-btn" data-id="${log.id}" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Details</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;

                    // Update statistics
                    document.getElementById('totalLogs').textContent = logs.length;
                    document.getElementById('errorLogs').textContent = logs.filter(l => l.severity === 'error').length;
                    document.getElementById('warningLogs').textContent = logs.filter(l => l.severity === 'warning').length;
                    document.getElementById('infoLogs').textContent = logs.filter(l => l.severity === 'info').length;

                    // Add detail view handlers
                    document.querySelectorAll('.view-log-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const logId = e.target.dataset.id;
                            const log = logs.find(l => l.id == logId);
                            showLogDetail(log);
                        });
                    });

                    // Pagination
                    document.getElementById('pagination').innerHTML = `
                        <button class="btn btn-secondary" ${currentPage === 1 ? 'disabled' : ''}>← Vorherige</button>
                        <span style="margin: 0 1rem;">Seite ${currentPage}</span>
                        <button class="btn btn-secondary">Nächste →</button>
                    `;
                } else {
                    tableDiv.innerHTML = '<p class="text-center text-secondary">Keine Logs gefunden</p>';
                }
            } catch (error) {
                console.error('Failed to load logs:', error);
                tableDiv.innerHTML = `<p class="text-center alert-error">Fehler: ${error.message}</p>`;
            }
        }

        // Show log detail
        function showLogDetail(log) {
            const content = document.getElementById('logDetailContent');
            content.innerHTML = `
                <div class="form-group">
                    <label class="form-label">Log-ID</label>
                    <p>${log.id}</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Zeitstempel</label>
                    <p>${utils.formatDate(log.timestamp)} ${utils.formatTime(log.timestamp)}</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Typ</label>
                    <p><span class="badge badge-secondary">${log.type}</span></p>
                </div>
                <div class="form-group">
                    <label class="form-label">Schweregrad</label>
                    <p><span class="badge badge-${log.severity === 'error' ? 'danger' : log.severity === 'warning' ? 'warning' : 'success'}">${log.severity}</span></p>
                </div>
                <div class="form-group">
                    <label class="form-label">Benutzer</label>
                    <p>${log.user}</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Nachricht</label>
                    <p>${log.message}</p>
                </div>
                <div class="form-group">
                    <label class="form-label">IP-Adresse</label>
                    <p>${log.ip}</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Stack Trace / Details</label>
                    <pre style="background: #f5f5f5; padding: 1rem; border-radius: 4px; overflow-x: auto;">
Demo-Log-Details werden hier angezeigt
Keine weiteren Informationen verfügbar
                    </pre>
                </div>
            `;
            logDetailModal.classList.remove('hidden');
        }

        // Action buttons
        document.getElementById('refreshLogsBtn').addEventListener('click', loadLogs);

        document.getElementById('exportLogsBtn').addEventListener('click', () => {
            utils.showAlert('Log-Export wird implementiert', 'warning');
        });

        document.getElementById('clearLogsBtn').addEventListener('click', () => {
            if (confirm('Alle Logs wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden!')) {
                utils.showAlert('Logs werden gelöscht...', 'warning');
                setTimeout(loadLogs, 1000);
            }
        });

        // Filter handlers
        document.getElementById('applyFilterBtn').addEventListener('click', loadLogs);
        
        document.getElementById('resetFilterBtn').addEventListener('click', () => {
            document.getElementById('logTypeFilter').value = '';
            document.getElementById('severityFilter').value = '';
            document.getElementById('timeRangeFilter').value = '24h';
            document.getElementById('searchFilter').value = '';
            document.getElementById('dateFromFilter').value = '';
            document.getElementById('dateToFilter').value = '';
            loadLogs();
        });

        // Load initial data
        loadLogs();
    </script>
</body>
</html>
