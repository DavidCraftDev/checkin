services:
  web-php:
    container_name: checkin-php
    build: .
    restart: always
    depends_on:
      - db
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_URL=postgres://postgres:postgres@db:5432/postgres
      - DEFAULT_LOGIN_USERNAME=admin
      # IMPORTANT: Change DEFAULT_LOGIN_PASSWORD for any non-development (production/staging) deployment.
      - DEFAULT_LOGIN_PASSWORD=CHANGE_ME_IN_PRODUCTION
      - MAINTENANCE=false
      # LDAP Configuration (optional)
      - LDAP_URI=ldap://ldap.example.com
      - LDAP_BASE_DN=dc=example,dc=com
      - LDAP_BIND_DN=cn=admin,dc=example,dc=com
      - LDAP_BIND_PASSWORD=
      # WebUntis Configuration (optional)
      - UNTIS_SERVER=webuntis.example.com
      - UNTIS_SCHOOL=
      - UNTIS_USERNAME=
      - UNTIS_PASSWORD=
      # Email Configuration (optional)
      - EMAIL_SMTP_HOST=smtp.gmail.com
      - EMAIL_SMTP_PORT=587
      - EMAIL_SMTP_USER=
      - EMAIL_SMTP_PASSWORD=
      - EMAIL_SMTP_SECURE=true
      - EMAIL_FROM=noreply@school.edu
    ports:
      - "8080:80"
    volumes:
      - "./data:/var/www/html/data"

  db:
    container_name: checkin-php-db
    image: postgres:18-alpine
    restart: always
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - checkin_php_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  checkin_php_pgdata:
    name: checkin_php_pgdata
